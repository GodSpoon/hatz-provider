name: Unpublish churn versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Unpublish intermediate versions
        run: |
          for v in 1.1.2 1.1.3 1.1.4 1.1.5 1.1.6 1.1.7 1.1.8 1.1.9 1.2.0 1.2.1; do
            npm unpublish hatz-provider@$v --force || echo "unpublish $v failed"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
